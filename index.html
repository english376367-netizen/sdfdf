<head>

<style>
:root{--navy:#173b67;--blue:#2878c7;--pale:#eaf4ff;--gold:#ffe28a;--green:#16834a;--red:#c43d3d;--ink:#203047}
*{box-sizing:border-box}body{margin:0;background:#f3f7fc;color:var(--ink);font:16px/1.55 Arial,sans-serif}

header h1{font-size:clamp(20px,4vw,28px);margin:0 0 5px}header p{margin:0}
.wrap{max-width:1100px;margin:20px auto;padding:0 14px}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 5px 20px #173b6714;margin-bottom:16px}
input,button,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 16px;background:var(--blue);color:white;cursor:pointer;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e7eef7;color:#234}.danger{background:#c94b4b}.good{background:#16834a}

.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#e3edf8;color:#173b67}.tabs button.active{background:#173b67;color:white}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.progress{height:9px;background:#e5edf6;border-radius:9px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#28a36a;width:0}
.question{font-size:18px;font-weight:700;margin:16px 0}.options{display:grid;gap:10px}.opt{width:100%;text-align:left;background:#f4f7fb;color:#1f3047;border:2px solid #dbe5f0}.opt:hover{border-color:#7daee0}.opt.selected{border-color:#2878c7;background:#eaf4ff}.opt.correct{border-color:#16834a;background:#e5f7ed}.opt.wrong{border-color:#c43d3d;background:#fff0f0}

.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.scrollbox{height:440px;overflow:auto;border:1px solid #dce6f0;border-radius:12px;padding:15px;white-space:normal;overscroll-behavior:contain}.scrollbox p{margin-top:0}.translation{color:#53677d;background:#f4f7fb;padding:12px;border-radius:9px;margin-top:12px}

 <div class="topline"><div><h2 id="sectionTitle"></h2><div class="small" id="sectionDesc"></div></div><div class="score" id="score"></div></div>

<script>
const sections = [
{title:"I. Pronunciation",desc:"Choose the word with a different sound in the underlined part.",type:"mc",items:[
{q:"Which word has a different sound in the underlined part?",o:["A. coll<u>e</u>ction","B. h<u>e</u>lper","C. cont<u>e</u>st","D. ev<u>e</u>ryone"],a:3,why:"Âm /e/ trong collection, helper và contest khác với âm /e/ trong everyone (thường được phát âm /e/ ở âm tiết không nhấn? Đáp án theo đề: D)."},
{q:"Which word has a different sound in the underlined part?",o:["A. f<u>a</u>ther","B. f<u>a</u>mily","C. h<u>a</u>ppen","D. m<u>a</u>tter"],a:0,why:"Chữ a trong father phát âm /ɑː/, còn các từ family, happen, matter có âm /æ/."},
{q:"Which word has a different sound in the underlined part?",o:["A. st<u>a</u>ndard","B. n<u>a</u>tural","C. pot<u>a</u>to","D. f<u>a</u>ctor"],a:2,why:"Đáp án theo đề là potato. Chữ a trong potato có cách phát âm khác với nhóm còn lại."},
{q:"Which word has a different sound in the underlined part?",o:["A. l<u>au</u>gh","B. n<u>au</u>ghty","C. d<u>au</u>ghter","D. t<u>au</u>ght"],a:0,why:"Trong laugh, au phát âm /ɑː/, còn naughty, daughter và taught có âm /ɔː/."},
{q:"Which word has a different sound in the underlined part?",o:["A. b<u>ea</u>r","B. n<u>ea</u>r","C. w<u>ea</u>r","D. p<u>ea</u>r"],a:1,why:"Near có âm /ɪə/ (hoặc /ɪr/), trong khi bear, wear và pear có âm /eə/."},
{q:"Which word has a different sound in the underlined part?",o:["A. sl<u>ow</u>ly","B. d<u>ow</u>ntown","C. p<u>ow</u>er","D. cr<u>ow</u>ded"],a:0,why:"Slowly có âm /əʊ/, còn downtown, power và crowded có âm /aʊ/."},
{q:"Which word has a different sound in the underlined part?",o:["A. c<u>oa</u>st","B. upl<u>oa</u>d","C. abr<u>oa</u>d","D. r<u>oa</u>dside"],a:2,why:"Abroad có âm /ɔː/ ở phần oa, còn coast, upload và roadside có âm /əʊ/."},
{q:"Which word has a different sound in the underlined part?",o:["A. h<u>o</u>me","B. sh<u>o</u>pping","C. c<u>o</u>mb","D. l<u>o</u>cate"],a:1,why:"Shopping có âm /ɒ/, còn home, comb và locate có âm /əʊ/."}]},
{title:"II. Vocabulary and Grammar",desc:"Choose A, B, C or D to complete each sentence.",type:"mc",items:[
{q:"There is a market in our area where you can buy all kinds of handmade products. It may be the biggest _____ market in our country.",o:["A. thing","B. product","C. handicraft","D. selling"],a:2,why:"Handicraft market = chợ thủ công mỹ nghệ. Handicraft là đồ thủ công."},
{q:"The Tower of London is one of the top _____ in the UK.",o:["A. tourist places","B. tourism places","C. guided tours","D. tourist attractions"],a:3,why:"Tourist attractions nghĩa là các điểm/địa điểm thu hút khách du lịch. Cấu trúc: one of the + tính từ so sánh nhất + danh từ số nhiều."},
{q:"This restaurant serves _____ of Italy such as lasagna and risotto.",o:["A. speciality dish","B. speciality food","C. special dish","D. special things"],a:1,why:"Speciality food là món ăn đặc sản. Câu nói nhà hàng phục vụ các món đặc sản của Ý."},
{q:"This beautiful headband _____ us of our holiday in Greece.",o:["A. tells","B. shares","C. reminds","D. makes"],a:2,why:"Remind somebody of something = làm ai nhớ đến điều gì."},
{q:"The condo is so small and there are not enough _____ for families with young children.",o:["A. facilities","B. equipment","C. tools","D. space"],a:0,why:"Facilities = tiện nghi/cơ sở vật chất. Enough facilities: đủ tiện nghi. Danh từ facilities đếm được số nhiều."},
{q:"They don't know _____ to preserve the natural beauty of their region.",o:["A. what","B. who","C. where","D. how"],a:3,why:"How to + động từ nguyên mẫu = cách làm thế nào. How to preserve = làm thế nào để bảo tồn."},
{q:"My classmates didn't understand _____ to do.",o:["A. what","B. who","C. where","D. how"],a:0,why:"What to do = làm gì. What đóng vai trò tân ngữ của động từ do."},
{q:"The city is now a big _____ site with many half-finished buildings.",o:["A. waste","B. tourist","C. storage","D. construction"],a:3,why:"Construction site = công trường xây dựng."},
{q:"The town is overcrowded and lacks public _____.",o:["A. health","B. amenities","C. education","D. places"],a:1,why:"Public amenities = các tiện ích công cộng như công viên, nhà vệ sinh công cộng, thư viện..."},
{q:"I used to live in the _____ area, but I moved to a quiet suburb two years ago.",o:["A. downtown","B. underground","C. outskirts","D. village"],a:0,why:"Downtown area = khu vực trung tâm thành phố. Used to + V: đã từng làm gì trong quá khứ."},
{q:"Children normally feel a lot of _____ about their first day at school.",o:["A. anxiety","B. calm","C. hurry","D. suffering"],a:0,why:"Anxiety = sự lo lắng. Feel anxiety about something = cảm thấy lo lắng về điều gì."},
{q:"It takes a lot of _____ effort to understand these ideas.",o:["A. bodily","B. mental","C. physical","D. emotional"],a:1,why:"Mental effort = nỗ lực trí óc/tinh thần; phù hợp với việc hiểu các ý tưởng."}]},
{title:"III. Closest in meaning",desc:"Choose the option CLOSEST in meaning to the underlined word or phrase.",type:"mc",items:[
{q:"She browsed the shop but didn't buy anything. She found it a bit <u>pricey</u>.",o:["A. crowded","B. modern","C. attractive","D. expensive"],a:3,why:"Pricey = đắt tiền, đồng nghĩa với expensive."},
{q:"The underground was <u>packed with</u> people. I couldn’t find a seat.",o:["A. full on","B. empty of","C. full of","D. convenient for"],a:2,why:"Packed with = chật kín/đầy người, gần nghĩa với full of."},
{q:"Her team is <u>carrying out</u> a project to recycle food waste.",o:["A. running","B. proposing","C. funding","D. aiming"],a:0,why:"Carry out = thực hiện/tiến hành; trong ngữ cảnh này gần nghĩa với run a project."}]},
{title:"IV. Opposite in meaning",desc:"Choose the option OPPOSITE in meaning to the underlined phrase.",type:"mc",items:[
{q:"Neither Lan nor Hoa <u>stayed home alone</u> last weekend. They went to the shopping mall together.",o:["A. hung out with one another","B. came down with one another","C. got rid of one another","D. looked up to one another"],a:0,why:"Stayed home alone = ở nhà một mình. Hung out with one another = đi chơi cùng nhau, mang nghĩa trái ngược trong ngữ cảnh."}]},
{title:"V. Complete the passage",desc:"Read the whole passage and choose the suitable word for each numbered blank.",type:"passage",passage:`<p>Nowadays delivery people are commonly seen in our city. Of all the delivery people who <b>(1) _____</b> us products, our family likes Mr Nam the most. Mr Nam is about 40 years old and usually wears a yellow <b>(2) _____</b>. He is a kind, friendly person, and he brings products to our house. He always calls to check if we are at home. I still <b>(4) _____</b> one day when we were in Ho Chi Minh City, Mr Nam called my father several times until my father answered his call. He <b>(5) _____</b> us that we had a parcel. As we were not at home, my father asked him to <b>(6) _____</b> the parcel with our neighbour. Mr Nam found our neighbour and called us before <b>(7) _____</b> the parcel to her. He also allowed us to transfer money to him by online banking. My father sometimes talks to him and he happily <b>(8) _____</b> about his life and work.</p>`,items:[
{q:"Nowadays delivery people are commonly seen in our city. Of all the delivery people who (1) _____ us products, our family likes Mr Nam the most.",o:["shares","deliver","told","before","uniform","remember","giving","leave"],a:1,why:"Deliver somebody something = giao thứ gì cho ai. Chủ ngữ số nhiều delivery people nên dùng deliver."},
{q:"Mr Nam is about 40 years old and usually wears a yellow (2) _____.",o:["shares","deliver","told","before","uniform","remember","giving","leave"],a:4,why:"Wear a uniform = mặc đồng phục."},
{q:"I still (4) _____ one day when we were in Ho Chi Minh City, Mr Nam called my father several times until my father answered his call.",o:["shares","deliver","told","before","uniform","remember","giving","leave"],a:5,why:"Remember + mệnh đề/cụm thời gian = nhớ lại. I still remember one day... = Tôi vẫn nhớ một ngày..."},
{q:"He (5) _____ us that we had a parcel.",o:["shares","deliver","told","before","uniform","remember","giving","leave"],a:2,why:"Tell somebody that + mệnh đề = nói với ai rằng... Quá khứ của tell là told."},
{q:"As we were not at home, my father asked him to (6) _____ the parcel with our neighbour.",o:["shares","deliver","told","before","uniform","remember","giving","leave"],a:7,why:"Ask somebody to + V nguyên mẫu. Leave the parcel with our neighbour = để bưu kiện ở chỗ hàng xóm."},
{q:"Mr Nam found our neighbour and called us before (7) _____ the parcel to her.",o:["shares","deliver","told","before","uniform","remember","giving","leave"],a:6,why:"Before là giới từ trong cấu trúc before + V-ing. Giving là dạng V-ing của give."},
{q:"My father sometimes talks to him and he happily (8) _____ about his life and work.",o:["shares","deliver","told","before","uniform","remember","giving","leave"],a:0,why:"Share about his life and work = chia sẻ về cuộc sống và công việc. Chủ ngữ he nên động từ thêm -s."}]},
{title:"VI. Reading – True or False",desc:"Read the passage and decide whether each statement is True (T) or False (F).",type:"split",passage:`<p>Chi, a student at a specialised high school in Ha Noi, needs to have a well-balanced life because she wants to excel in her studies, pursue her passions and hobbies, etc. Below are some of the things she often does to achieve a well-balanced life.</p><p>Firstly, Chi starts each day by planning her schedule and setting priorities for the day, making sure to allocate time for studying, extracurricular activities, and socialising. She also takes breaks throughout the day to relax and recharge. In addition, Chi dedicates time to her hobbies, such as reading, listening to music, and doing sports. She believes that pursuing her passions brings her joy and a sense of fulfilment.</p><p>Chi also spends time with her family and friends regularly and makes an effort to stay in touch even when she is busy with schoolwork. She understands the importance of building and maintaining strong relationships with them. Finally, Chi gives priority to her physical and mental health. She gets enough sleep, eats a balanced diet, and does exercise regularly. She also practises mindfulness and meditation to manage stress and maintain a positive mindset. By following these practices, we believe that Chi is on her way to achieving a fulfilling and well-balanced life.</p>`,
translation:`Chi, một học sinh tại trường THPT chuyên ở Hà Nội, cần có một cuộc sống cân bằng vì bạn ấy muốn học tập xuất sắc, theo đuổi đam mê và sở thích. Dưới đây là một số việc bạn ấy thường làm để đạt được cuộc sống cân bằng.<br><br>Đầu tiên, Chi bắt đầu mỗi ngày bằng cách lên lịch trình và đặt ra các ưu tiên trong ngày, bảo đảm dành thời gian cho việc học, hoạt động ngoại khóa và giao lưu. Bạn ấy cũng nghỉ giải lao trong ngày để thư giãn và nạp lại năng lượng. Ngoài ra, Chi dành thời gian cho sở thích như đọc sách, nghe nhạc và chơi thể thao. Bạn ấy tin rằng theo đuổi đam mê mang lại niềm vui và cảm giác mãn nguyện.<br><br>Chi cũng thường xuyên dành thời gian cho gia đình và bạn bè, đồng thời cố gắng giữ liên lạc ngay cả khi bận học. Bạn ấy hiểu tầm quan trọng của việc xây dựng và duy trì các mối quan hệ tốt đẹp. Cuối cùng, Chi ưu tiên sức khỏe thể chất và tinh thần. Bạn ấy ngủ đủ giấc, ăn uống cân bằng và tập thể dục thường xuyên. Bạn ấy cũng thực hành chánh niệm và thiền để kiểm soát căng thẳng và duy trì suy nghĩ tích cực. Bằng cách thực hiện những thói quen này, chúng ta tin rằng Chi đang trên con đường đạt được cuộc sống trọn vẹn và cân bằng.`,
items:[
{q:"1. Chi starts each day by planning her schedule and setting priorities for the day.",o:["T – True","F – False"],a:0,why:"Đoạn 2 nêu rõ Chi starts each day by planning her schedule and setting priorities. Nghĩa là Chi bắt đầu mỗi ngày bằng việc lên lịch và sắp xếp ưu tiên."},
{q:"2. She neglects her hobbies to focus on her study.",o:["T – True","F – False"],a:1,why:"Sai. Bài đọc nói Chi dành thời gian cho sở thích như đọc sách, nghe nhạc và chơi thể thao."},
{q:"3. She often spends time with her family and friends when she has free time from schoolwork.",o:["T – True","F – False"],a:1,why:"Theo đáp án cung cấp: F. Lưu ý: nội dung bài đọc nói Chi thường xuyên dành thời gian cho gia đình và bạn bè, kể cả khi bận học; câu phát biểu này có thể gây tranh luận về cách diễn đạt 'when she has free time'. Giữ đáp án F theo tài liệu."},
{q:"4. Chi gives priority to her physical and mental health.",o:["T – True","F – False"],a:0,why:"Đúng. Đoạn cuối nêu Chi gives priority to her physical and mental health = Chi ưu tiên sức khỏe thể chất và tinh thần."}]},
{title:"VII. Sentence building",desc:"Type the complete sentence. Use Check to submit once; Hint shows a grammar structure.",type:"typed",items:[
{q:"My area / famous / some specialities / such / bun cha, banh cuon / and bun oc.",a:"My area is famous for some specialities such as bun cha, banh cuon, and bun oc.",hint:"S + be famous for + N. such as + examples.",why:"Cấu trúc: be famous for + danh từ = nổi tiếng về điều gì; such as + ví dụ = chẳng hạn như. Nghĩa: Khu vực của tôi nổi tiếng với một số món đặc sản như bún chả, bánh cuốn và bún ốc."},
{q:"As firefighters, / they / ready / put out / fires / and save / people.",a:"As firefighters, they are ready to put out fires and save people.",hint:"be ready to + V nguyên mẫu; put out a fire = dập lửa.",why:"Cấu trúc: be ready to + V = sẵn sàng làm gì. Put out fires = dập tắt các đám cháy. Nghĩa: Là những người lính cứu hỏa, họ sẵn sàng dập lửa và cứu người."},
{q:"They / decided / hang / cinema / instead / a coffee shop.",a:"They decided to hang out at the cinema instead of a coffee shop.",hint:"decide to + V; hang out at + place; instead of + noun/V-ing.",why:"Cấu trúc: decide to + V = quyết định làm gì; hang out at + địa điểm = đi chơi ở đâu; instead of + danh từ/V-ing = thay vì. Nghĩa: Họ quyết định đi chơi ở rạp chiếu phim thay vì ở quán cà phê."},
{q:"The restaurant / bit / pricey, so / it was / popular / teenagers.",a:"The restaurant was a bit pricey, so it was not popular with teenagers.",hint:"a bit + adjective; be popular with + group. Dùng not để thể hiện quan hệ nguyên nhân – kết quả theo câu mẫu.",why:"Cấu trúc: a bit + tính từ = hơi; be popular with + người = được ... yêu thích. Nghĩa: Nhà hàng hơi đắt, vì vậy nó không phổ biến với thanh thiếu niên."},
{q:"If / we / want / balance / life / study / it / be / important / for us / manage / our time / effectively.",a:"If we want to balance life and study, it is important for us to manage our time effectively.",hint:"If + present simple, ...; It is + adjective + for somebody + to V.",why:"Cấu trúc: câu điều kiện loại 1 (If + hiện tại đơn, ...); It is important for somebody to do something = điều quan trọng đối với ai là làm gì. Nghĩa: Nếu chúng ta muốn cân bằng cuộc sống và việc học, điều quan trọng là chúng ta phải quản lý thời gian hiệu quả."}]},
{title:"VIII. Adjective forms and conditionals",desc:"Type the correct form. Each question has its own Check, Hint and Reset buttons.",type:"typed",items:[
{q:"The (busy) _____ the street is, the less I like it. I hate noisy places.",a:"busier",hint:"The + comparative ..., the + comparative ... (càng ... càng ...).",why:"Cấu trúc so sánh kép: The + comparative + S + V, the + comparative + S + V = càng... thì càng... Busy đổi thành busier (y đổi thành i + er). Nghĩa: Đường phố càng đông đúc thì tôi càng không thích. Tôi ghét những nơi ồn ào."},
{q:"The later it gets at night, the (cold) _____ it becomes.",a:"colder",hint:"The + comparative ..., the + comparative ...; tính từ ngắn thêm -er.",why:"So sánh kép. Cold là tính từ ngắn nên thêm -er thành colder. Nghĩa: Càng về khuya thì trời càng lạnh."},
{q:"The (light) _____ the street was, the (safe) _____ I felt.",a:"lighter; safer",hint:"The + comparative ..., the + comparative ...; light và safe thêm -er.",why:"So sánh kép: The lighter..., the safer... Light → lighter; safe → safer. Nghĩa: Đường phố càng sáng thì tôi càng cảm thấy an toàn."},
{q:"The (crowded) _____ the bus got, the more difficult it was for me to breathe.",a:"more crowded",hint:"Tính từ dài: more + adjective trong so sánh hơn.",why:"Crowded là tính từ nhiều âm tiết nên dùng more crowded. Nghĩa: Xe buýt càng đông đúc thì tôi càng khó thở."},
{q:"I fear that the more modern city life is, the (friendly) _____ people are to one another.",a:"less friendly",hint:"So sánh giảm: less + adjective = ít ... hơn.",why:"Less friendly = kém thân thiện hơn. Nghĩa: Tôi lo rằng cuộc sống thành phố càng hiện đại thì mọi người càng kém thân thiện với nhau."},
{q:"If she (want) _____ to follow the traditional recipe, she should not put curry powder in that dish.",a:"wants",hint:"If + present simple, S + should + V nguyên mẫu. She/he/it: động từ thêm -s/-es.",why:"Câu điều kiện loại 1: If + hiện tại đơn, ... should + V nguyên mẫu. Chủ ngữ she nên want → wants. Nghĩa: Nếu cô ấy muốn làm theo công thức truyền thống, cô ấy không nên cho bột cà ri vào món ăn đó."},
{q:"If you (not be) _____ in a hurry, you may have a cup of tea now.",a:"are not",hint:"If + present simple negative; you + are not.",why:"Phủ định hiện tại đơn với you: are not (aren't). Nghĩa: Nếu bạn không vội, bây giờ bạn có thể uống một tách trà."},
{q:"If you want to get there on time, you should (take) _____ a taxi.",a:"take",hint:"should + bare infinitive (động từ nguyên mẫu không to).",why:"Sau should dùng động từ nguyên mẫu không to: should take. Nghĩa: Nếu bạn muốn đến đó đúng giờ, bạn nên đi taxi."}]},
{title:"IX. Sentence rewriting",desc:"Type the rewritten sentence with the same meaning.",type:"typed",items:[
{q:"It’s difficult to get around the city at rush hours due to congested roads.",starter:"Traffic congestion",a:"Traffic congestion makes it difficult to travel in the city at rush hours.",hint:"Traffic congestion = tình trạng ùn tắc giao thông; make + O + adjective + to V.",why:"Cấu trúc: make + object + adjective + to V = khiến ai/việc gì trở nên... Nghĩa: Ùn tắc giao thông khiến việc đi lại trong thành phố vào giờ cao điểm trở nên khó khăn."},
{q:"They should reduce the amount of fatty foods in their daily meals.",starter:"They should cut down on",a:"They should cut down on the amount of fatty foods in their daily meals.",hint:"reduce = cut down on (giảm bớt). Sau should dùng V nguyên mẫu.",why:"Cut down on = giảm bớt, đồng nghĩa với reduce. Nghĩa: Họ nên giảm lượng thức ăn nhiều chất béo trong các bữa ăn hằng ngày."},
{q:"She can’t decide who she should ask for advice.",starter:"She can’t decide who to",a:"She can’t decide who to ask for advice.",hint:"Wh-word + to-infinitive: who + to + V.",why:"Rút gọn mệnh đề với từ để hỏi: who she should ask → who to ask. Nghĩa: Cô ấy không thể quyết định nên hỏi ai để xin lời khuyên."},
{q:"Take these pills or you might feel better.",starter:"If you take these pills,",a:"If you take these pills, you might feel better.",hint:"If + present simple, ... might + V. Chuyển câu mệnh lệnh + or sang câu điều kiện theo đáp án.",why:"Cấu trúc: If + hiện tại đơn, S + might + V. Nghĩa theo câu viết lại: Nếu bạn uống những viên thuốc này, bạn có thể cảm thấy khỏe hơn. Lưu ý: câu gốc trong tài liệu có thể bị lỗi logic; đáp án được giữ nguyên theo tài liệu."}]}
];
let s=0, idx=0, scores=sections.map(()=>0), attempts=sections.map(x=>x.items.map(()=>false)), chosen=sections.map(x=>x.items.map(()=>null)), typedValues=sections.map(x=>x.items.map(()=>"")), hints=sections.map(x=>x.items.map(()=>false));
function unlock(){if(document.getElementById('password').value==='367'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else document.getElementById('loginMsg').textContent='Incorrect password. Please try again.'}
function renderTabs(){document.getElementById('tabs').innerHTML=sections.map((x,i)=>`<button class="${i===s?'active':''}" onclick="changeSection(${i})">${x.title.split('.')[0]}</button>`).join('')}
function changeSection(n){s=n;idx=0;render()}
function render(){
 const sec=sections[s], item=sec.items[idx];renderTabs();
 document.getElementById('sectionTitle').textContent=sec.title;document.getElementById('sectionDesc').textContent=sec.desc;
 document.getElementById('score').textContent=`Score: ${scores[s]} / ${sec.items.length}`;
 document.getElementById('counter').textContent=`Question ${idx+1} of ${sec.items.length}`;
 document.getElementById('status').textContent=attempts[s][idx]?'Submitted – answer locked':'Not answered';
 document.getElementById('bar').style.width=((idx+1)/sec.items.length*100)+'%';
 let html='';
 if(sec.type==='passage'){
 html=`<div class="split"><div class="scrollbox"><h3>FULL PASSAGE</h3>${sec.passage}<div class="wordbank"><b>Word box:</b> shares • deliver • told • before • uniform • remember • giving • leave</div></div><div class="scrollbox"><h3>QUESTION ${idx+1} OF ${sec.items.length}</h3><div class="question">${item.q}</div><div class="options">${item.o.map((o,j)=>`<button class="opt ${attempts[s][idx]?(j===item.a?'correct':(chosen[s][idx]===j?'wrong':'')):''}" ${attempts[s][idx]?'disabled':''} onclick="answer(${j})">${o}</button>`).join('')}</div>${feedback(item)}<div class="selector">${sec.items.map((it,i)=>`<button class="${idx===i?'current':''} ${attempts[s][i]?'done':''}" onclick="go(${i})">${i+1}</button>`).join('')}</div></div></div>`;
 }else if(sec.type==='split'){
 html=`<div class="split"><div class="scrollbox"><h3>READING PASSAGE</h3>${sec.passage}<div class="translation"><b>Vietnamese translation</b><br>${sec.translation}</div></div><div class="scrollbox"><h3>QUESTIONS</h3><div class="question">${item.q}</div>${sec.items.map((it,i)=>`<div style="margin:12px 0"><button class="secondary" onclick="go(${i})">Question ${i+1}</button> <span class="small">${attempts[s][i]?'Submitted':''}</span></div>`).join('')}<div class="options">${item.o.map((o,j)=>`<button class="opt ${attempts[s][idx]?(j===item.a?'correct':(chosen[s][idx]===j?'wrong':'')):''}" ${attempts[s][idx]?'disabled':''} onclick="answer(${j})">${o}</button>`).join('')}</div>${feedback(item)}</div></div>`;
 }else if(sec.type==='typed'){
 const parts = item.a.split(';');
 html=`<div class="question">${item.q}</div>${sec.title.startsWith("IX.")?`<div class="hint"><b>Writing starter:</b> <mark style="background:#ffe28a;padding:3px 6px;border-radius:4px">${item.starter}</mark> <span class="small">Continue the sentence using this beginning.</span></div>`:""}<div class="selector">${sec.items.map((it,i)=>`<button class="${idx===i?'current':''} ${attempts[s][i]?'done':''}" onclick="go(${i})">${i+1}</button>`).join('')}</div>
 <input class="answer" id="typed" ${attempts[s][idx]?'disabled':''} value="${escapeAttr(typedValues[s][idx])}" placeholder="Type your answer here..." autocomplete="off">
 <div class="navgroup"><button onclick="showHint()">HINT</button><button class="good" onclick="checkTyped()" ${attempts[s][idx]?'disabled':''}>CHECK</button><button class="secondary" onclick="resetOne()">RESET THIS QUESTION</button></div>
 <div id="hintBox" class="hint ${hints[s][idx]?'':'hidden'}">${item.hint}</div>${feedback(item)}
 <div class="small">One submission per question. Use the question numbers above to jump to any question.</div>`;
 }else{
 html=`<div class="question">${item.q}</div>${sec.title.startsWith('V.')?'<div class="wordbank"><b>Word box:</b> shares • deliver • told • before • uniform • remember • giving • leave</div>':''}<div class="options">${item.o.map((o,j)=>`<button class="opt ${attempts[s][idx]?(j===item.a?'correct':(chosen[s][idx]===j?'wrong':'')):''}" ${attempts[s][idx]?'disabled':''} onclick="answer(${j})">${o}</button>`).join('')}</div>${feedback(item)}`;
 }
 document.getElementById('content').innerHTML=html+`<div class="nav"><div class="navgroup"><button class="secondary" onclick="prev()" ${idx===0?'disabled':''}>PREVIOUS</button><button onclick="next()" ${idx===sec.items.length-1?'disabled':''}>NEXT</button></div><div class="navgroup"><button class="danger" onclick="resetSection()">RESET SECTION</button></div></div>`;
}
function feedback(item){if(!attempts[s][idx])return '';let ok=sections[s].type==='typed'?isTypedCorrect(typedValues[s][idx],item.a):(chosen[s][idx]===item.a);return `<div class="feedback ${ok?'correct':'wrong'}"><b>${ok?'Correct!':'Answer / Suggested answer:'}</b> ${sections[s].type==='typed'?item.a:item.o[item.a]}<br><b>Explanation (Vietnamese):</b> ${item.why}</div>`}
function answer(j){if(attempts[s][idx])return;attempts[s][idx]=true;chosen[s][idx]=j;const item=sections[s].items[idx];if(j===item.a)scores[s]++;render()}
function normalize(x){return x.toLowerCase().trim().replace(/[’']/g,"'").replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ')}
function isTypedCorrect(v,a){if(a.includes(';')){let x=normalize(v).replace(/\s*;\s*/g,';');let y=a.split(';').map(normalize).join(';');return x===y}return normalize(v)===normalize(a)}
function checkTyped(){if(attempts[s][idx])return;let el=document.getElementById('typed');typedValues[s][idx]=el.value;attempts[s][idx]=true;if(isTypedCorrect(el.value,sections[s].items[idx].a))scores[s]++;render()}
function showHint(){hints[s][idx]=true;document.getElementById('hintBox').classList.remove('hidden')}
function resetOne(){attempts[s][idx]=false;chosen[s][idx]=null;typedValues[s][idx]='';hints[s][idx]=false;scores[s]=sections[s].items.reduce((n,it,i)=>n+(attempts[s][i]&&isTypedCorrect(typedValues[s][i],it.a)?1:0),0);render()}
function resetSection(){if(!confirm('Reset all questions and score in this section?'))return;scores[s]=0;attempts[s]=sections[s].items.map(()=>false);chosen[s]=sections[s].items.map(()=>null);typedValues[s]=sections[s].items.map(()=> '');hints[s]=sections[s].items.map(()=>false);idx=0;render()}
function go(i){idx=i;render()}function prev(){if(idx>0){idx--;render()}}function next(){if(idx<sections[s].items.length-1){idx++;render()}}
function escapeAttr(x){return x.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','x','a','s','p'].includes(e.key.toLowerCase()))e.preventDefault()});
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>{if(!['INPUT','TEXTAREA'].includes(e.target.tagName))e.preventDefault()});
</script></body></html>
